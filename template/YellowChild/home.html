<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPung - Sunny Kid Yellow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Nunito:wght@400;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', 'Kanit', sans-serif;
            background-color: #FFF6CC;
            /* Butter Cream */
            color: #6B6B6B;
            /* Warm Gray */
        }

        .sunny-gradient {
            background: linear-gradient(180deg, #FFD84D 0%, #FFF6CC 100%);
        }

        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(255, 216, 77, 0.3);
        }

        .rounded-luxury {
            border-radius: 28px;
        }

        .btn-honey {
            background-color: #FFC83D;
            transition: all 0.3s ease;
        }

        .btn-honey:hover {
            background-color: #FFB347;
            transform: scale(1.03);
        }
    </style>
</head>

<body class="min-h-screen pb-24"> <!-- Header & Hero Section -->
    <header class="sunny-gradient pt-12 pb-8 px-6 rounded-b-[40px] text-center relative overflow-hidden">
        <div class="flex justify-between items-start mb-6">
            <div class="w-10"></div>
            <h1 class="text-2xl font-extrabold text-[#6B6B6B] tracking-tight">WELCOME BACK!</h1> <button
                class="bg-white p-3 rounded-full shadow-sm relative"> <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-6 w-6 text-[#FFC83D]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg> <span
                    class="absolute top-2 right-2 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></span>
            </button>
        </div>
        <h2 class="text-4xl font-black text-[#6B6B6B] mb-8 leading-tight">วันนี้ฟิตให้สนุกกัน! 🌼✨</h2>
        <div class="relative inline-block mb-4">
            <div
                class="w-64 h-64 bg-white/50 rounded-full absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 blur-2xl">
            </div> <img src="../../public/images/gorila/ConcentrationCurl.png" alt="FitPung Mascot"
                class="w-48 h-48 relative z-10 mx-auto object-contain">
        </div>
        <div class="bg-white/80 backdrop-blur-md py-2 px-6 rounded-full inline-flex items-center gap-2 shadow-sm mb-4">
            <span class="text-[#FFC83D] font-bold text-lg">Level 12</span> <span
                class="text-gray-500 font-medium">You're doing great!</span>
        </div>
    </header> <!-- Quick Stats -->
    <section class="px-6 -mt-10 grid grid-cols-3 gap-3 mb-10">
        <div class="bg-white p-4 rounded-luxury text-center card-shadow">
            <div class="text-[#FFB347] mb-1">🔥</div>
            <p class="text-[10px] uppercase font-bold text-gray-400">Calories</p>
            <p class="text-xl font-black text-[#6B6B6B]">450</p>
        </div>
        <div class="bg-white p-4 rounded-luxury text-center card-shadow">
            <div class="text-[#FFB347] mb-1">⏱️</div>
            <p class="text-[10px] uppercase font-bold text-gray-400">Minutes</p>
            <p class="text-xl font-black text-[#6B6B6B]">32</p>
        </div>
        <div class="bg-white p-4 rounded-luxury text-center card-shadow">
            <div class="text-[#FFB347] mb-1">👣</div>
            <p class="text-[10px] uppercase font-bold text-gray-400">Steps</p>
            <p class="text-xl font-black text-[#6B6B6B]">8.4k</p>
        </div>
    </section> <!-- Workout Section -->
    <section class="px-6 mb-8">
        <h3 class="text-2xl font-extrabold text-[#6B6B6B] mb-6 flex items-center gap-2"> Workout วันนี้ </h3>
        <div class="bg-white p-6 rounded-[32px] card-shadow">
            <div class="flex items-center gap-4 mb-8">
                <div class="w-16 h-16 bg-[#FFF9E6] rounded-2xl flex items-center justify-center text-3xl"> 🏋️ </div>
                <div>
                    <h4 class="text-xl font-black text-[#6B6B6B]">Full Body Fun</h4>
                    <p class="text-sm text-gray-400 font-bold">4 Exercises • 25 Mins</p>
                </div>
            </div>
            <div class="space-y-6 mb-10">
                <div class="flex items-center justify-between group">
                    <div class="flex items-center gap-4"> <span
                            class="text-xs font-black text-[#FFB347] bg-[#FFF9E6] w-8 h-8 rounded-full flex items-center justify-center">01</span>
                        <p class="font-extrabold text-[#6B6B6B] text-lg">Jumping Jacks</p>
                    </div> <span class="text-sm font-bold text-[#FFB347]">3 Sets</span>
                </div>
                <div class="flex items-center justify-between group">
                    <div class="flex items-center gap-4"> <span
                            class="text-xs font-black text-[#FFB347] bg-[#FFF9E6] w-8 h-8 rounded-full flex items-center justify-center">02</span>
                        <p class="font-extrabold text-[#6B6B6B] text-lg">Squats</p>
                    </div> <span class="text-sm font-bold text-[#FFB347]">3 Sets</span>
                </div>
                <div class="flex items-center justify-between group">
                    <div class="flex items-center gap-4"> <span
                            class="text-xs font-black text-[#FFB347] bg-[#FFF9E6] w-8 h-8 rounded-full flex items-center justify-center">03</span>
                        <p class="font-extrabold text-[#6B6B6B] text-lg">Push Ups</p>
                    </div> <span class="text-sm font-bold text-[#FFB347]">3 Sets</span>
                </div>
            </div> <button
                class="w-full btn-honey py-5 rounded-[24px] text-white text-xl font-black shadow-lg shadow-[#FFC83D]/40 flex items-center justify-center gap-3">
                Start Workout <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 fill-current" viewBox="0 0 20 20"
                    fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                        clip-rule="evenodd" />
                </svg> </button>
        </div>
    </section> <!-- Bottom Navigation -->
    <nav
        class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-[#FFF6CC] px-8 py-4 flex justify-between items-center z-50">
        <a href="home.html" class="flex flex-col items-center gap-1">
            <div class="w-1.5 h-1.5 bg-[#FFC83D] rounded-full mb-1"></div> <svg xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6 text-[#FFC83D]" fill="currentColor" viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
            </svg> <span class="text-[10px] font-black text-[#FFC83D] uppercase tracking-wider">Home</span>
        </a> <a href="workout.html" class="flex flex-col items-center gap-1 group"> <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6 text-gray-300 group-hover:text-[#FFC83D] transition-colors" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                    d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg> <span class="text-[10px] font-black text-gray-300 uppercase tracking-wider">Workouts</span> </a>
        <a href="map.html" class="flex flex-col items-center gap-1 group"> <svg xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6 text-gray-300 group-hover:text-[#FFC83D] transition-colors" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                    d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
            </svg> <span class="text-[10px] font-black text-gray-300 uppercase tracking-wider">Map</span> </a>
        <a href="progress.html" class="flex flex-col items-center gap-1 group"> <svg xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6 text-gray-300 group-hover:text-[#FFC83D] transition-colors" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                    d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" />
            </svg> <span class="text-[10px] font-black text-gray-300 uppercase tracking-wider">Progress</span> </a>
        <a href="profile.html" class="flex flex-col items-center gap-1 group"> <svg xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6 text-gray-300 group-hover:text-[#FFC83D] transition-colors" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg> <span class="text-[10px] font-black text-gray-300 uppercase tracking-wider">Profile</span> </a>
    </nav>
</body>

</html>
