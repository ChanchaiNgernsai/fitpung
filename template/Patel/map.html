<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>FitPung Gym Map - Cute Power Edition</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#c4bbf7",
                        "background-light": "#f6f6f8",
                        "background-dark": "#131121",
                        "gym-floor": "#E0F2FE", // Light tint of #7DD3FC
                        "bubblegum": "#FF85C1",
                        "pastel-purple": "#c4bbf7",
                        "deep-purple": "#4c1d95",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "1.5rem", // 24px
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Spline Sans', sans-serif;
            background-color: #f6f6f8;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Map Animation */
        .machine-node {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .machine-node:active {
            transform: scale(0.9);
        }
    </style>
</head>

<body class="bg-[#f6f6f8] text-deep-purple font-display overflow-x-hidden">
    <div
        class="relative flex h-screen w-full flex-col max-w-md mx-auto bg-white shadow-2xl overflow-hidden md:max-w-none md:mx-0">
        <!-- Header (Cute Power Style) -->
        <div class="z-20 p-6 bg-white border-b border-primary/10">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-3">
                    <div
                        class="size-12 bg-primary rounded-full flex items-center justify-center text-white shadow-lg shadow-primary/30">
                        <span class="material-symbols-outlined !text-3xl">bolt</span>
                    </div>
                    <h1 class="text-2xl font-black tracking-tight text-deep-purple">FitPung</h1>
                </div>
                <div class="flex gap-2">
                    <button
                        class="size-10 rounded-full bg-white flex items-center justify-center shadow-sm text-primary border border-primary/10">
                        <span class="material-symbols-outlined">notifications</span>
                    </button>
                    <div class="size-10 rounded-full border-2 border-primary overflow-hidden bg-white shadow-sm">
                        <img class="w-full h-full object-cover"
                            src="../../public/images/gorila/ConcentrationCurl.png" />
                    </div>
                </div>
            </div>

            <div class="flex gap-2 mb-6">
                <div class="flex-1 relative">
                    <span
                        class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60">search</span>
                    <input
                        class="w-full pl-12 pr-4 py-3.5 rounded-full border-none bg-primary/10 focus:ring-2 focus:ring-primary text-sm font-bold text-deep-purple placeholder:text-primary/40"
                        placeholder="Find equipment..." type="text" />
                </div>
                <div class="flex bg-primary/10 rounded-full p-1.5">
                    <button
                        class="px-5 py-2 bg-white rounded-full shadow-sm text-xs font-black text-deep-purple">F1</button>
                    <button class="px-5 py-2 text-primary/60 text-xs font-black">F2</button>
                </div>
            </div>
        </div>

        <!-- Interactive Map Canvas (Full Visibility Floor Plan) -->
        <div class="relative flex-1 w-full bg-[#E0F2FE] overflow-hidden">
            <!-- Grid Background -->
            <div class="absolute inset-0 z-0 opacity-20"
                style="background-image: radial-gradient(#4c1d95 1px, transparent 1px); background-size: 32px 32px;">
            </div>

            <!-- Floor Plan Layout Area (Synchronized Phone-width on Desktop) -->
            <div
                class="absolute top-4 left-4 right-4 bottom-28 md:top-8 md:w-[450px] md:left-1/2 md:-translate-x-1/2 md:bottom-32 bg-white/30 rounded-[3rem] border-4 border-white shadow-inner flex items-center justify-center">
                <!-- Map Legend -->
                <div
                    class="absolute left-6 top-6 z-10 bg-white/80 backdrop-blur-sm px-4 py-3 rounded-2xl flex items-center gap-2 text-[10px] font-black border border-white shadow-sm">
                    <div class="size-3 bg-primary rounded-full shadow-[0_0_8px_rgba(196,187,247,0.8)]"></div>
                    <span>READY</span>
                </div>

                <!-- Equipment Icons (Balanced technical layout) -->
                <div class="relative w-full h-full p-4 md:p-10">
                    <!-- Top Row: Treadmills & Rower -->
                    <div class="absolute top-[8%] left-1/2 -translate-x-1/2 flex gap-4 md:gap-6">
                        <div class="machine-node cursor-pointer opacity-60 hover:opacity-100 transition-all hover:scale-110"
                            onclick="updateMachine('Treadmill A1', 'Cardio', '0 mins', 'Legs/Heart')">
                            <img src="../../public/images/equipment/Treadmill.svg"
                                class="w-16 h-16 md:w-20 md:h-20 grayscale" />
                        </div>
                        <div class="machine-node cursor-pointer opacity-60 hover:opacity-100 transition-all hover:scale-110"
                            onclick="updateMachine('Treadmill A2', 'Cardio', '5 mins', 'Legs/Heart')">
                            <img src="../../public/images/equipment/Treadmill.svg"
                                class="w-16 h-16 md:w-20 md:h-20 grayscale" />
                        </div>
                        <div class="machine-node cursor-pointer opacity-60 hover:opacity-100 transition-all hover:scale-110"
                            onclick="updateMachine('Rower R1', 'Cardio', 'OPEN', 'Back/Heart')">
                            <img src="../../public/images/equipment/Elliptical.svg"
                                class="w-16 h-16 md:w-20 md:h-20 grayscale rotate-90" />
                        </div>
                    </div>

                    <!-- Left Staggered Pair -->
                    <div class="absolute top-[26%] left-[4%]">
                        <div class="machine-node cursor-pointer opacity-60 hover:opacity-100 transition-all hover:scale-110"
                            onclick="updateMachine('Smith Machine', 'Weights', 'OPEN', 'Full Body')">
                            <img src="../../public/images/equipment/SmithMachine.svg"
                                class="w-20 h-20 md:w-24 md:h-24 grayscale" />
                        </div>
                    </div>

                    <div class="absolute bottom-[10%] left-[2%]">
                        <div class="machine-node cursor-pointer opacity-60 hover:opacity-100 transition-all hover:scale-110 -rotate-45"
                            onclick="updateMachine('Leg Press L1', 'Weights', '10 mins', 'Legs')">
                            <img src="../../public/images/equipment/LegPress.svg"
                                class="w-20 h-20 md:w-24 md:h-24 grayscale" />
                        </div>
                    </div>

                    <!-- Right Staggered Trio -->
                    <div class="absolute top-[18%] right-[2%]">
                        <div class="machine-node cursor-pointer opacity-60 hover:opacity-100 transition-all hover:scale-110"
                            onclick="updateMachine('Leg Extension', 'Weights', '3 mins', 'Quads')">
                            <img src="../../public/images/equipment/LegPress.svg"
                                class="w-20 h-20 md:w-24 md:h-24 grayscale rotate-90" />
                        </div>
                    </div>

                    <div class="absolute top-[32%] right-[25%]">
                        <div class="machine-node cursor-pointer opacity-60 hover:opacity-100 transition-all hover:scale-110"
                            onclick="updateMachine('Adductor', 'Weights', 'OPEN', 'Hips')">
                            <img src="../../public/images/equipment/LegPress.svg"
                                class="w-20 h-20 md:w-24 md:h-24 grayscale rotate-90" />
                        </div>
                    </div>

                    <div class="absolute bottom-[4%] right-[2%]">
                        <div class="machine-node cursor-pointer opacity-60 hover:opacity-100 transition-all hover:scale-110"
                            onclick="updateMachine('Dumbbell Zone', 'Weights', 'OPEN', 'Arms/Shoulders')">
                            <img src="../../public/images/equipment/Dumbbells.svg"
                                class="w-20 h-20 md:w-24 md:h-24 grayscale" />
                        </div>
                    </div>

                    <!-- Center Focus: Bubbly Bench (Absolute Center) -->
                    <div class="absolute top-[48%] left-1/2 -translate-x-1/2 z-20"
                        onclick="updateMachine('Bubbly Bench Press', 'Weights', '0 mins', 'Chest/Arms')">
                        <div class="relative group">
                            <div
                                class="size-32 md:size-36 flex items-center justify-center transition-all hover:scale-110">
                                <img src="../../public/images/equipment/BenchPress.svg"
                                    class="w-24 h-24 md:w-28 md:h-28 drop-shadow-xl" />
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
        <!-- Floating Controls -->
        <div class="absolute right-6 top-1/2 -translate-y-1/2 flex flex-col gap-3 z-30">
            <button
                class="size-12 bg-white rounded-2xl shadow-xl flex items-center justify-center text-primary border border-primary/20 active:scale-90 transition-transform">
                <span class="material-symbols-outlined font-black">add</span>
            </button>
            <button
                class="size-12 bg-white rounded-2xl shadow-xl flex items-center justify-center text-primary border border-primary/20 active:scale-90 transition-transform">
                <span class="material-symbols-outlined font-black">remove</span>
            </button>
            <button
                class="size-12 bg-white rounded-2xl shadow-xl flex items-center justify-center text-primary border border-primary/20 active:scale-90 transition-transform">
                <span class="material-symbols-outlined font-black">near_me</span>
            </button>
        </div>

        <!-- Pain Relief Button (Cute) -->
        <button
            class="absolute bottom-[350px] left-6 z-30 flex items-center gap-2 bg-deep-purple text-white px-6 py-3.5 rounded-2xl shadow-2xl hover:scale-105 transition-transform active:scale-95">
            <span class="material-symbols-outlined !text-xl">accessibility_new</span>
            <span class="text-xs font-black uppercase tracking-widest">Pain Relief</span>
        </button>
    </div>
    <!-- Machine Detail Card (Bubbly Light Style) -->
    <div id="machine-card" class="absolute bottom-0 left-0 right-0 z-50 px-6 pb-24 transition-all duration-500">
        <div
            class="bg-white rounded-[3rem] p-8 shadow-[0_-20px_50px_rgba(196,187,247,0.15)] border border-primary/10 relative overflow-hidden">
            <!-- Dismiss Handle (Visual) -->
            <div class="w-12 h-1.5 bg-primary/20 rounded-full mx-auto mb-6" onclick="hideMachine()"></div>

            <!-- Status Row -->
            <div class="flex items-center justify-between mb-6">
                <div>
                    <span id="card-tag"
                        class="text-[10px] font-black text-bubblegum uppercase tracking-[0.2em] bg-bubblegum/10 px-3 py-1 rounded-full">Selected</span>
                    <h3 id="card-title" class="text-3xl font-black text-deep-purple mt-4 leading-tight">Bubbly
                        Bench
                        Press</h3>
                    <p class="text-sm font-bold text-primary mt-1">Zone B • Floor 1</p>
                </div>
                <div class="bg-green-50 px-4 py-2 rounded-2xl border border-green-100 flex flex-col items-center">
                    <span class="text-[8px] font-black text-green-600 uppercase tracking-widest">Status</span>
                    <span class="text-xs font-black text-green-600">OPEN</span>
                </div>
            </div>

            <!-- Metrics -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-background-light p-5 rounded-[2.5rem] flex items-center gap-4">
                    <div
                        class="size-12 bg-white rounded-full flex items-center justify-center text-primary shadow-sm border border-primary/10">
                        <span class="material-symbols-outlined !text-2xl">timer</span>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-primary/40 uppercase tracking-widest">Wait Time
                        </p>
                        <p id="card-wait" class="text-base font-black text-deep-purple">0 mins</p>
                    </div>
                </div>
                <div class="bg-background-light p-5 rounded-[2.5rem] flex items-center gap-4">
                    <div
                        class="size-12 bg-white rounded-full flex items-center justify-center text-primary shadow-sm border border-primary/10">
                        <span id="card-icon" class="material-symbols-outlined !text-2xl">bolt</span>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-primary/40 uppercase tracking-widest">Target</p>
                        <p id="card-target" class="text-base font-black text-deep-purple">Chest/Arms</p>
                    </div>
                </div>
            </div>

            <!-- Action Button -->
            <button
                class="w-full bg-primary text-white py-5 rounded-[2rem] font-black text-xl shadow-[0_8px_0_#aa9ef2] active:shadow-none active:translate-y-[4px] transition-all flex items-center justify-center gap-3">
                START WORKOUT <span class="material-symbols-outlined !text-2xl">play_arrow</span>
            </button>

            <button onclick="hideMachine()"
                class="absolute top-8 right-8 size-10 bg-primary/10 rounded-full flex items-center justify-center text-primary hover:bg-primary/20">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
    </div>
    <!-- Floating Body Overlay (Initially Hidden/Contextually used) -->
    <div class="hidden absolute inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-6">
        <div class="bg-white w-full rounded-xl p-6 flex flex-col items-center gap-4 relative overflow-hidden">
            <button class="absolute top-4 right-4 text-primary">
                <span class="material-symbols-outlined">close</span>
            </button>
            <h2 class="text-xl font-bold text-center">Where does it hurt?</h2>
            <div class="relative w-48 h-80">
                <img alt="A simplified human silhouette diagram with highlighted joints"
                    class="w-full h-full object-contain opacity-40"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuDKBnhiZd2-mm1iv9tZ458KO66-tgZnXzRG7if24A34RS9GRHtOAJAa9rWyZH_Q8tKp4YN04__vKasbAnhUaZZnwSlvtRZcqrguEBB9YwsbRD1T4BgHtPA_So4PNaPHzDl3RfpTaXGKi-y090PuiTWpU3VQWM_nGQe7hfFU_-RsrYA7FxAhSlcgNzkgAfRIhxPgkXEfcnhm4fq1rgiG5-boNTpZlLrwv6_6-J1wanV1ncPnySiBGzz98U0auZhiIjzSS7DJIoSSTGc" />
                <!-- Pain Hotspots -->
                <div class="absolute top-[20%] left-1/2 -translate-x-1/2 size-4 bg-red-400 rounded-full animate-ping">
                </div>
                <div class="absolute bottom-[25%] left-[30%] size-4 bg-orange-400 rounded-full animate-ping">
                </div>
            </div>
            <p class="text-xs text-center font-medium px-4 opacity-70">Tap a body part to find recommended
                equipment
                for recovery and stretching.</p>
            <button class="w-full py-3 bg-primary/20 text-primary font-bold rounded-full">RECOMMEND FOR
                ME</button>
        </div>
    </div>
    <!-- Bottom Navigation (Cute Pink Style) -->
    <div
        class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-primary/10 flex items-center justify-between px-8 py-3 max-w-md mx-auto shadow-[0_-10px_30px_rgba(0,0,0,0.03)]">
        <a href="map.html" class="flex flex-col items-center gap-1 text-primary">
            <span class="material-symbols-outlined text-3xl font-variation-fill">map</span>
            <span class="text-[10px] font-black uppercase tracking-tighter">Gym Map</span>
        </a>
        <a href="progress.html" class="flex flex-col items-center gap-1 text-primary/30">
            <span class="material-symbols-outlined text-3xl">bar_chart</span>
            <span class="text-[10px] font-black uppercase tracking-tighter">Logs</span>
        </a>
        <div class="relative -top-8">
            <button
                class="size-16 bg-bubblegum rounded-full flex items-center justify-center text-white shadow-xl shadow-bubblegum/30 border-4 border-white active:scale-90 transition-transform">
                <span class="material-symbols-outlined text-3xl font-black">add</span>
            </button>
        </div>
        <a href="home.html" class="flex flex-col items-center gap-1 text-primary/30">
            <span class="material-symbols-outlined text-3xl">home</span>
            <span class="text-[10px] font-black uppercase tracking-tighter">Home</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center gap-1 text-primary/30">
            <span class="material-symbols-outlined text-3xl">person</span>
            <span class="text-[10px] font-black uppercase tracking-tighter">Set</span>
        </a>
    </div>
    </div>
    <script>
        function updateMachine(name, type, wait, target) {
            const card = document.getElementById('machine-card');
            const title = document.getElementById('card-title');
            const waitEl = document.getElementById('card-wait');
            const targetEl = document.getElementById('card-target');
            const tagEl = document.getElementById('card-tag');

            title.innerText = name;
            waitEl.innerText = wait || '0 mins';
            targetEl.innerText = target || 'Full Body';
            tagEl.innerText = type || 'Selected';

            // Show card with animation
            card.style.display = 'block';
            setTimeout(() => {
                card.classList.remove('translate-y-full', 'opacity-0');
            }, 10);
        }

        function hideMachine() {
            const card = document.getElementById('machine-card');
            card.classList.add('translate-y-full', 'opacity-0');
            setTimeout(() => {
                if (card.classList.contains('opacity-0')) {
                    card.style.display = 'none';
                }
            }, 500);
        }

        // Initialize: Hide card on load
        window.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('machine-card');
            card.style.display = 'none';
            card.classList.add('translate-y-full', 'opacity-0');
        });
    </script>
</body>

</html>
